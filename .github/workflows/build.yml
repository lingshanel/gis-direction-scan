name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Test and package WAR
        run: mvn -B -ntp clean verify
      - name: Build container image
        run: docker build -t gis-scan:ci .

